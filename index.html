    <!-- 设置界面 (重构版) -->
    <div id="settings-view" class="view hidden-right settings-layout">
        <header>
            <span style="font-weight:800; font-size:1.3rem; letter-spacing:1px; color:var(--text-color);">设置</span>
            <button class="icon-btn" onclick="closeSettings()">✕</button>
        </header>
        
        <!-- 顶部导航栏 -->
        <div class="settings-nav">
            <button class="nav-item active" onclick="switchSettingsTab('tab-look', this)">外观</button>
            <button class="nav-item" onclick="switchSettingsTab('tab-func', this)">功能</button>
            <button class="nav-item" onclick="switchSettingsTab('tab-data', this)">数据</button>
            <button class="nav-item" onclick="switchSettingsTab('tab-safe', this)">隐私</button>
        </div>

        <div class="settings-content-area">
            
            <!-- 1. 外观设置 -->
            <div id="tab-look" class="settings-panel active">
                <div class="setting-card">
                    <div class="card-title">纸张主题</div>
                    <div class="theme-grid">
                        <div class="theme-opt" onclick="setTheme('theme-beige')"><div class="circle" style="background:#fffbf0"></div><span>米黄</span></div>
                        <div class="theme-opt" onclick="setTheme('theme-white')"><div class="circle" style="background:#ffffff"></div><span>纯白</span></div>
                        <div class="theme-opt" onclick="setTheme('theme-green')"><div class="circle" style="background:#f1f8f3"></div><span>薄荷</span></div>
                        <div class="theme-opt" onclick="setTheme('theme-pink')"><div class="circle" style="background:#fff5f7"></div><span>樱花</span></div>
                    </div>
                    <div class="divider"></div>
                    <div class="paper-style-row">
                        <button class="style-btn" onclick="setPaper('paper-lines')">横线</button>
                        <button class="style-btn" onclick="setPaper('paper-grid')">方格</button>
                        <button class="style-btn" onclick="setPaper('paper-blank')">空白</button>
                    </div>
                </div>

                <div class="setting-card">
                    <div class="card-title">个性化</div>
                    <div class="switch-row">
                        <span>夜间模式</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="chk-dark" onchange="toggleDarkMode()">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="divider"></div>
                    <div class="input-group">
                        <span>自定义背景</span>
                        <div style="display:flex; gap:10px; margin-top:10px;">
                            <button class="btn-small" onclick="document.getElementById('bg-upload').click()">选择图片</button>
                            <button class="btn-small danger" onclick="clearBgImage()">清除</button>
                        </div>
                    </div>
                </div>

                <div class="setting-card">
                    <div class="card-title">字体</div>
                    <div style="display:flex; gap:8px;">
                        <input type="text" id="font-url-input" class="modern-input" placeholder="输入字体 URL...">
                        <button class="btn-icon-only" onclick="applyFont()">✓</button>
                        <button class="btn-icon-only" onclick="resetFont()">✕</button>
                    </div>
                </div>
            </div>

            <!-- 2. 功能设置 -->
            <div id="tab-func" class="settings-panel">
                 <div class="setting-card">
                    <div class="card-title">实用工具</div>
                    <div class="switch-row">
                        <span>待办清单入口</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="chk-todo" onchange="toggleTodoSetting()">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="divider"></div>
                    <div class="switch-row">
                        <span>贴纸功能</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="chk-sticker" onchange="toggleStickerSetting()">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="setting-card">
                    <div class="card-title">回顾与搜索</div>
                    <div class="action-row" onclick="openMonthGallery()">
                        <span>🗓️ 月度快速浏览</span>
                        <span class="arrow">›</span>
                    </div>
                    <div class="divider"></div>
                    <div class="input-group">
                        <input type="text" id="search-input" class="modern-input" placeholder="🔍 搜索日记关键词..." oninput="performSearch(this.value)">
                        <div id="search-results" class="search-results-mini"></div>
                    </div>
                </div>
            </div>

            <!-- 3. 数据设置 -->
            <div id="tab-data" class="settings-panel">
                <div class="setting-card highlight-card">
                    <div class="card-header-flex">
                        <div class="card-title">☁️ 私有云同步</div>
                        <button class="btn-xs" onclick="openCloudHelp(event)">教程</button>
                    </div>
                    <div class="cloud-status-box" id="cloud-status-display">
                        <div class="status-dot"></div>
                        <span id="cloud-state-text">未配置</span>
                    </div>
                    <button class="btn-full" onclick="toggleCloudPanel()">配置 / 同步</button>
                    
                    <!-- 隐藏的配置面板 -->
                    <div id="cloud-panel" class="cloud-panel" style="margin-top:15px;">
                        <input type="text" id="cloud-url" placeholder="Project URL" class="modern-input">
                        <input type="password" id="cloud-key" placeholder="Anon Key" class="modern-input">
                        <div class="btn-grid">
                            <button onclick="saveCloudConfig()" class="btn-small primary">保存配置</button>
                            <button onclick="testCloudConnection()" class="btn-small">测试连接</button>
                        </div>
                        <div id="cloud-ops" style="display:none; margin-top:15px; border-top:1px dashed var(--line-color); padding-top:15px;">
                            <button onclick="backupToCloud()" class="btn-action upload">☁️ 上传备份</button>
                            <button onclick="restoreFromCloud()" class="btn-action download">📥 下载恢复</button>
                        </div>
                    </div>
                </div>

                <div class="setting-card">
                    <div class="card-title">本地备份 & 导出</div>
                    <div class="action-row" onclick="exportData()">
                        <span>💾 导出备份 (JSON)</span>
                        <span class="arrow">›</span>
                    </div>
                    <div class="divider"></div>
                    <div class="action-row" onclick="document.getElementById('import-file').click()">
                        <span>📂 恢复备份</span>
                        <span class="arrow">›</span>
                    </div>
                    <div class="divider"></div>
                    <div class="action-row" onclick="exportDiaryImage()">
                        <span>🖼️ 导出当前日记长图</span>
                        <span class="arrow">›</span>
                    </div>
                    <div class="divider"></div>
                    <div class="action-row danger-text" onclick="clearCache()">
                        <span>🗑️ 清空应用缓存 (重置)</span>
                        <span class="arrow">›</span>
                    </div>
                </div>
            </div>

            <!-- 4. 安全设置 -->
            <div id="tab-safe" class="settings-panel">
                <div class="setting-card">
                    <div class="card-title">应用锁</div>
                    <div class="switch-row">
                        <span>PIN 码保护</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="chk-pin" onchange="togglePinLock()">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div id="row-bio" class="divider" style="display:none"></div>
                    <div id="row-bio-content" class="switch-row" style="display:none">
                        <span>生物识别 (指纹/面容)</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="chk-bio" onchange="toggleBiometrics()">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                <p style="font-size:0.8rem; opacity:0.6; padding:0 10px; text-align:center;">
                    安全提示：密码仅保存在本地浏览器缓存中，清除缓存会导致密码重置。
                </p>
            </div>

        </div>
    </div>
