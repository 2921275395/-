<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日记本</title>
    <style>
        :root {
            /* 默认主题色 - 米黄色系 */
            --bg-color: #FDFBF7;
            --main-color: #F2EFE5;
            --accent-color: #D4C5A8;
            --text-color: #4A4A4A;
            --paper-bg: #FFFFFF;
            --line-color: #E0E0E0;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* 黑暗模式覆盖 */
        body.dark-mode {
            --bg-color: #1a1a1a;
            --main-color: #2c2c2c;
            --accent-color: #444;
            --text-color: #e0e0e0;
            --paper-bg: #2a2a2a;
            --line-color: #333;
            --shadow: 0 4px 12px rgba(0,0,0,0.5);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; font-family: var(--font-stack); background: var(--bg-color); color: var(--text-color); transition: background 0.3s, color 0.3s; overflow: hidden; height: 100vh; }

        /* 通用按钮 */
        button { border: none; background: none; font-size: 16px; color: var(--text-color); cursor: pointer; padding: 8px; }
        
        /* === 主界面：日历 === */
        #calendar-view {
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        h1 { font-size: 24px; font-weight: 600; margin: 0; letter-spacing: 1px; }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            text-align: center;
        }

        .weekday { font-size: 12px; color: #999; margin-bottom: 10px; font-weight: bold; }
        
        .day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            font-size: 14px;
            position: relative;
            transition: all 0.2s;
            cursor: pointer;
        }

        .day.selected { background-color: var(--accent-color); color: white; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .day.has-diary::after {
            content: ''; width: 4px; height: 4px; background-color: #FF6B6B; border-radius: 50%; position: absolute; bottom: 6px;
        }
        .day.empty { cursor: default; }

        /* === 侧边索引贴 (Side Tab) === */
        #side-tab {
            position: fixed;
            top: 50%;
            right: -120px; /* 默认隐藏 */
            transform: translateY(-50%);
            width: 100px;
            height: 60px;
            background: var(--accent-color);
            border-radius: 12px 0 0 12px;
            box-shadow: -2px 2px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            cursor: pointer;
        }
        #side-tab.show { right: 0; }
        #side-tab::before { content: '✎'; margin-right: 5px; font-size: 18px; }

        /* === 日记界面 (Diary View) === */
        #diary-view {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s;
        }
        
        #diary-view.active { opacity: 1; pointer-events: auto; }

        .diary-paper {
            width: 90%; height: 85%;
            background: var(--paper-bg);
            border-radius: 8px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transform: translateY(50px);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        #diary-view.active .diary-paper { transform: translateY(0); }

        .diary-header {
            padding: 15px;
            border-bottom: 1px solid var(--line-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.1);
        }

        .date-display { font-size: 18px; font-weight: bold; color: var(--text-color); font-family: serif; }

        #diary-content {
            flex: 1;
            width: 100%;
            border: none;
            resize: none;
            outline: none;
            padding: 20px;
            font-size: 16px;
            line-height: 1.8; /* 行高配合背景线 */
            background-color: transparent;
            color: var(--text-color);
            overflow-y: auto;
        }

        /* 纸张样式 - CSS生成 */
        .paper-blank { background-image: none; }
        .paper-lined {
            background-image: repeating-linear-gradient(transparent, transparent 31px, var(--line-color) 31px, var(--line-color) 32px);
            background-attachment: local;
            line-height: 32px !important;
        }
        .paper-grid {
            background-image: linear-gradient(var(--line-color) 1px, transparent 1px), linear-gradient(90deg, var(--line-color) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .diary-footer {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--line-color);
            font-size: 12px;
            color: #999;
        }

        /* 翻页按钮 */
        .nav-btn { font-size: 20px; padding: 0 15px; color: var(--accent-color); }

        /* === 设置界面 === */
        #settings-modal {
            position: fixed; bottom: -100%; left: 0; width: 100%;
            background: var(--bg-color);
            border-radius: 20px 20px 0 0;
            padding: 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            z-index: 30;
            transition: bottom 0.3s;
            max-height: 80vh; overflow-y: auto;
        }
        #settings-modal.active { bottom: 0; }
        
        .setting-group { margin-bottom: 20px; }
        .setting-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; color: #888; }
        
        .theme-options, .paper-options { display: flex; gap: 10px; }
        .color-circle { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #ddd; cursor: pointer; }
